<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FORJA · Research receiver</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a18;color:#f1f5f0;font:16px/1.55 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:42px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.brand{letter-spacing:5px;font-weight:750;color:#b8e6be}.tag{font-size:12px;color:#aabab2}h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:12px 0}h2{font-size:22px}p{color:#aabab2}section,.card{background:#1a2824;border:1px solid #304139;border-radius:20px;padding:24px;margin:18px 0}input{background:#101a18;border:1px solid #53715f;color:white;padding:13px;border-radius:10px;font:inherit;min-width:260px;width:min(100%,440px)}button{background:#b8e6be;border:0;border-radius:10px;padding:13px 18px;color:#101a18;font:600 14px system-ui;cursor:pointer;margin:5px}button.secondary{background:#2d4034;color:#ddedde}button.danger{background:#51352f;color:#ffcbc0}button:disabled{opacity:.4;cursor:default}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.muted,small{color:#aabab2}.pill{background:#2d4034;color:#b8e6be;border-radius:24px;padding:4px 10px;font-size:12px}#sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{margin:0}.id{font:11px monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:12px;max-height:400px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 6px;text-align:left;border-bottom:1px solid #35443b}#notice{color:#b8e6be}audio{max-width:100%}label{display:block;color:#aabab2;font-size:13px;margin-bottom:8px}
</style><main><header><div class="brand">FORJA <span class="tag">RESEARCH</span></div><div class="tag">Your test receiver</div></header>
<h1>See what arrived.</h1><p>Review phone-data sessions, download selected files, or listen to arriving microphone clips.</p>
<section><label for="token">Pairing token</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="Same token as your test phone"><button id="connect">Connect & refresh</button></div><small>The token stays in this page’s memory. Sessions expire after 24 hours.</small><p id="notice" role="status">No session data loaded.</p></section>
<div id="sessions"></div><section id="detail" hidden></section></main>
<script>
const el=id=>document.getElementById(id), note=t=>el('notice').textContent=t;
let token='',listenGeneration=0,context=null;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});if(!r.ok)throw Error('Server returned HTTP '+r.status);return r}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,action,cls){const b=node('button',text,cls);b.onclick=()=>Promise.resolve(action()).catch(e=>note(e.message));return b}
const when=t=>new Date(t).toLocaleString(), duration=n=>Math.round(n/1000)+' s';
async function refresh(){const {sessions}=await(await api('/v2/sessions')).json();el('sessions').replaceChildren();for(const s of sessions){const card=node('div',undefined,'card');card.append(node('span',s.consent.audio?'Microphone session':'Phone-data session','pill'),node('h2',when(s.created_at)),node('p',s.items.length+' items · '+Math.round(s.bytes/1024)+' KiB'),node('p',s.session_id,'id'),button('Open session',()=>open(s.session_id)));el('sessions').append(card)}note(sessions.length? sessions.length+' sessions available.':'Connected. No sessions yet.')}
el('connect').onclick=async()=>{stopListening();token=el('token').value.trim();try{await refresh()}catch(e){note(e.message)}};
function table(parent,headers,rows){const t=node('table');const head=node('tr');headers.forEach(v=>head.append(node('th',v)));t.append(head);for(const values of rows){const row=node('tr');values.forEach(v=>row.append(node('td',String(v))));t.append(row)}parent.append(t)}
function stopListening(){listenGeneration++;if(context){context.close().catch(()=>{});context=null}}
async function open(id){stopListening();const s=await(await api('/v2/sessions/'+id)).json();const d=el('detail');d.hidden=false;d.replaceChildren(node('h2',s.consent.audio?'Microphone clips':'Session details'),node('p',id,'id'),node('p','Expires '+when(s.expires_at)));
 d.append(button('Refresh session',()=>open(id),'secondary'),button('Delete entire session',async()=>{stopListening();await api('/v2/sessions/'+id,{method:'DELETE'});d.hidden=true;await refresh();note('Session deleted.')},'danger'));
 if(s.data){const data=await(await api('/v2/sessions/'+id+'/data')).json();if(data.visits){d.append(node('h2','Observed stops'));table(d,['Coordinates','First seen','Last seen','Observed time'],data.visits.map(v=>[v.latitude.toFixed(5)+', '+v.longitude.toFixed(5),when(v.first_seen),when(v.last_seen),duration(v.observed_ms)]))}if(data.app_usage){d.append(node('h2','App activity'));table(d,['App','Foreground time','Activity starts'],data.app_usage.map(v=>[v.label,duration(v.foreground_ms),v.opens]))}const details=node('details');details.append(node('summary','Exact metric fields'),node('pre',JSON.stringify(data,null,2)));d.append(details)}
 if(s.consent.audio){const liveStatus=node('p','Listening is off. Clips arrive with a short delay.');d.append(button('Listen to arriving clips',async()=>{stopListening();const generation=listenGeneration;context=new AudioContext();await context.resume();const ctx=context;let next=ctx.currentTime;const seen=new Set(s.items.filter(i=>i.kind==='audio').map(i=>i.item_id));liveStatus.textContent='Listening for new microphone clips…';for(let attempt=0;attempt<180&&generation===listenGeneration;attempt++){const current=await(await api('/v2/sessions/'+id)).json();for(const item of current.items.filter(i=>i.kind==='audio').sort((a,b)=>a.sequence-b.sequence)){if(seen.has(item.item_id))continue;seen.add(item.item_id);const bytes=await(await api('/v2/sessions/'+id+'/items/'+item.item_id)).arrayBuffer();if(generation!==listenGeneration)return;const audio=await ctx.decodeAudioData(bytes);const source=ctx.createBufferSource();source.buffer=audio;source.connect(ctx.destination);next=Math.max(next,ctx.currentTime+.1);source.start(next);next+=audio.duration;liveStatus.textContent='Listening · clip '+(item.sequence+1)}await new Promise(r=>setTimeout(r,1000))}if(generation===listenGeneration){stopListening();liveStatus.textContent='Listening ended.'}},'secondary'),button('Stop listening',()=>{stopListening();liveStatus.textContent='Listening stopped.'},'secondary'),liveStatus)}
 d.append(node('h2','Selected files and audio clips'));
 for(const item of s.items){const row=node('div',undefined,'row');row.append(node('span',item.name+' · '+Math.round(item.bytes/1024)+' KiB'),button('Download',async()=>{const blob=await(await api('/v2/sessions/'+id+'/items/'+item.item_id)).blob();const url=URL.createObjectURL(blob);const a=node('a');a.href=url;a.download=item.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'secondary'));if(item.kind==='audio')row.append(button('Play clip',async()=>{stopListening();context=new AudioContext();await context.resume();const bytes=await(await api('/v2/sessions/'+id+'/items/'+item.item_id)).arrayBuffer();const audio=await context.decodeAudioData(bytes);const source=context.createBufferSource();source.buffer=audio;source.connect(context.destination);source.start()},'secondary'));d.append(row)}d.scrollIntoView({behavior:'smooth'})}
window.addEventListener('pagehide',stopListening);
</script></html>
