name: Research build
on:
  push:
    branches: ['research/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test receiver
        run: node --test research-server/server.test.mjs
      - name: Build FORJA online copy
        run: bash ./gradlew assembleResearch testResearchUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: FORJA-Research-APK
          path: app/build/outputs/apk/research/app-research.apk
          if-no-files-found: error
