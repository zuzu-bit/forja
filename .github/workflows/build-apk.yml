name: Build FORJA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy serverul central FORJA (dacă secretele există)
        id: deploy
        run: |
          report_problem() {
            TITLE="Server nepublicat · run ${{ github.run_number }}"
            BODY=$(printf 'Diagnoza automată a publicării serverului:\n\n```\n%s\n```' "$1")
            gh issue create --title "$TITLE" --body "$BODY" 2>/dev/null || true
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            report_problem "Secretul CLOUDFLARE_API_TOKEN NU e vizibil pentru Actions. Verifică: github.com/zuzu-bit/forja/settings/secrets/actions → trebuie să apară în lista «Repository secrets» cu exact numele CLOUDFLARE_API_TOKEN."
            exit 0
          fi
          # CLOUDFLARE_ACCOUNT_ID e OPȚIONAL: pe conturi cu un singur cont, wrangler îl deduce singur.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          cd server
          npm install --no-audit --no-fund
          WHO=$(npx wrangler@3 whoami 2>&1 || true)
          echo "$WHO" | head -10
          OUT=$(npx wrangler@3 deploy 2>&1 | tee /dev/stderr) || true
          URL=$(echo "$OUT" | grep -oE "https://[a-z0-9.-]+\.workers\.dev" | head -1)
          if [ -z "$URL" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            report_problem "$(printf 'whoami:\n%s\n\ndeploy:\n%s' "$(echo "$WHO" | tail -c 2000)" "$(echo "$OUT" | tail -c 8000)")"
            exit 0
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler@3 secret put GEMINI_API_KEY >/dev/null 2>&1 || true
          fi
          echo "Server publicat la: $URL"
          echo "## Serverul central FORJA" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "- Analiza meselor: Gemini (cheia companiei)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Analiza meselor: banca de modele open-source Cloudflare (fără chei)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Sunete somn: Whisper (fără chei)" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: deploy-api
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: gradle_build
        env:
          FORJA_API_URL: ${{ needs.deploy-api.outputs.url }}
        run: |
          set -o pipefail
          echo "FORJA_API_URL=$FORJA_API_URL"
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Verifică serviciile Firebase (forja-65093)
        id: fbcheck
        if: success()
        run: |
          API_KEY=$(python3 -c "import json;print(json.load(open('app/google-services.json'))['client'][0]['api_key'][0]['current_key'])")
          PROJECT=forja-65093
          AUTH_STATUS="NECUNOSCUT"
          FS_STATUS="NECUNOSCUT"
          R=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$API_KEY" -H 'Content-Type: application/json' -d '{"email":"verificare@forja-check.test","password":"x","returnSecureToken":true}' || true)
          if echo "$R" | grep -q "OPERATION_NOT_ALLOWED\|PASSWORD_LOGIN_DISABLED"; then
            AUTH_STATUS="NEACTIVAT — activează Email/Password în consola Firebase (Authentication → Sign-in method)"
          elif echo "$R" | grep -q "EMAIL_NOT_FOUND\|INVALID_LOGIN_CREDENTIALS\|INVALID_PASSWORD"; then
            AUTH_STATUS="ACTIV ✓"
          elif echo "$R" | grep -q "CONFIGURATION_NOT_FOUND"; then
            AUTH_STATUS="NEACTIVAT — deschide Authentication în consola Firebase și apasă Get started, apoi activează Email/Password"
          else
            AUTH_STATUS="NECUNOSCUT: $(echo "$R" | head -c 200)"
          fi
          FS_URL="https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents/ping/ping"
          F=$(curl -s -o /tmp/fs_body -w "%{http_code}" "$FS_URL" || true)
          if grep -q "SERVICE_DISABLED\|has not been used" /tmp/fs_body 2>/dev/null; then
            FS_STATUS="NECREAT — deschide Firestore Database în consola Firebase și apasă Create database"
          else
            case "$F" in
              403) FS_STATUS="EXISTĂ ✓ (regulile blochează accesul anonim — corect)";;
              404) FS_STATUS="NECREAT — deschide Firestore Database în consola Firebase și apasă Create database";;
              200) FS_STATUS="EXISTĂ ✓ (atenție: reguli complet deschise)";;
              *) FS_STATUS="NECUNOSCUT (HTTP $F)";;
            esac
          fi
          {
            echo "AUTH_STATUS<<EOF"; echo "$AUTH_STATUS"; echo "EOF"
            echo "FS_STATUS<<EOF"; echo "$FS_STATUS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "## Stare Firebase" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autentificare email/parolă: $AUTH_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baza de date Firestore: $FS_STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Publică APK-ul la Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_STATUS: ${{ steps.fbcheck.outputs.AUTH_STATUS }}
          FS_STATUS: ${{ steps.fbcheck.outputs.FS_STATUS }}
          FORJA_API_URL: ${{ needs.deploy-api.outputs.url }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FORJA.apk
          SIZE=$(du -h FORJA.apk | cut -f1)
          NOTES=$(cat << EOF
          ## FORJA — aplicația Android (build #${{ github.run_number }})

          **Instalare pe telefon:** descarcă \`FORJA.apk\` de mai jos direct pe telefon, deschide fișierul și acceptă instalarea din surse necunoscute. Mărime: $SIZE.

          **Stare servicii Firebase la momentul build-ului:**
          - Autentificare email/parolă: $AUTH_STATUS
          - Baza de date Firestore: $FS_STATUS
          - Serverul central FORJA: ${FORJA_API_URL:-neconfigurat — analiza rulează local}

          Commit: ${{ github.sha }}
          EOF
          )
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest FORJA.apk --title "FORJA — ultimul APK (build #${{ github.run_number }})" --notes "$NOTES" --latest

      - name: Upload artifact (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FORJA-apk-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Închide issue-urile de build rezolvate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Build eșuat in:title" --json number -q '.[].number'); do
            gh issue close "$n" -c "Rezolvat — build #${{ github.run_number }} a trecut ✓" || true
          done
          if [ -n "${{ needs.deploy-api.outputs.url }}" ]; then
            for n in $(gh issue list --state open --search "Server nepublicat in:title" --json number -q '.[].number'); do
              gh issue close "$n" -c "Rezolvat — serverul e publicat la ${{ needs.deploy-api.outputs.url }} ✓" || true
            done
          fi

      - name: Raportează eroarea de build ca issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Build eșuat · run ${{ github.run_number }}"
          LOG=$(grep -E "error:|e: |FAILURE:|Caused by|What went wrong|> Task .* FAILED" -A 3 build.log 2>/dev/null | head -c 55000 || true)
          if [ -z "$LOG" ]; then LOG=$(tail -c 55000 build.log 2>/dev/null || echo "fără log"); fi
          BODY=$(printf '%s\n\n```\n%s\n```\nCommit: %s' "Log de eroare (extras automat):" "$LOG" "${{ github.sha }}")
          gh issue create --title "$TITLE" --body "$BODY" --label build-error 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
