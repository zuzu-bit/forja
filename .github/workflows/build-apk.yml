name: Build FORJA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "forja-source.tar.gz.b64"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "forja-source.tar.gz.b64"
      - ".github/workflows/build-apk.yml"
      - "build-trigger.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore Android project
        run: |
          mkdir -p android-project
          base64 --decode forja-source.tar.gz.b64 | tar -xz -C android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk
          cp android-project/app/build/outputs/apk/debug/app-debug.apk FORJA-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORJA-APK
          path: FORJA-debug.apk
          if-no-files-found: error
          retention-days: 7
