name: Build FORJA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      diag: ${{ steps.deploy.outputs.diag }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy serverul central FORJA (dacă secretele există)
        id: deploy
        run: |
          report_problem() {
            TITLE="Server nepublicat · run ${{ github.run_number }}"
            BODY=$(printf 'Diagnoza automată a publicării serverului:\n\n```\n%s\n```' "$1")
            gh issue create --title "$TITLE" --body "$BODY" 2>/dev/null || true
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            report_problem "Secretul CLOUDFLARE_API_TOKEN NU e vizibil pentru Actions. Verifică: github.com/zuzu-bit/forja/settings/secrets/actions → trebuie să apară în lista «Repository secrets» cu exact numele CLOUDFLARE_API_TOKEN."
            exit 0
          fi
          # CLOUDFLARE_ACCOUNT_ID e OPȚIONAL: pe conturi cu un singur cont, wrangler îl deduce singur.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          cd server
          npm install --no-audit --no-fund
          # Stocarea înregistrărilor de somn (se șterg automat la 24h).
          R2OUT=$(npx wrangler@3 r2 bucket create forja-sleep 2>&1 || true)
          echo "$R2OUT" | tail -3
          npx wrangler@3 r2 bucket create forja-media 2>&1 | tail -2 || true
          CFG="wrangler.toml"
          R2STATE="activă"
          if npx wrangler@3 r2 bucket list 2>/dev/null | grep -q "forja-sleep"; then
            for n in $(gh issue list --state open --search "Stocarea R2 in:title" --json number -q '.[].number'); do
              gh issue close "$n" -c "Rezolvat — permisiunea R2 funcționează, stocarea înregistrărilor e activă ✓" || true
            done
          fi
          if ! npx wrangler@3 r2 bucket list 2>/dev/null | grep -q "forja-sleep"; then
            # Tokenul nu are permisiunea R2 → publicăm fără stocare, restul rămâne live.
            awk 'BEGIN{skip=0} /^\[\[r2_buckets\]\]/{skip=3; next} skip>0{skip--; next} {print}' wrangler.toml > wrangler-nor2.toml
            CFG="wrangler-nor2.toml"
            R2STATE="INACTIVĂ — adaugă la token permisiunea Account → Workers R2 Storage → Edit"
            EXISTING=$(gh issue list --state open --search "Stocarea R2 in:title" --json number -q '.[0].number' || true)
            ERRTAIL=$(printf 'Eroarea exactă la crearea bucketului (run %s):\n\n```\n%s\n```' "${{ github.run_number }}" "$(echo "$R2OUT" | tail -c 1200)")
            if [ -z "$EXISTING" ]; then
              gh issue create --title "Stocarea R2 nu e activă (înregistrările de somn)" --body "Tokenul Cloudflare nu are permisiunea R2. Fix (30 sec, tokenul rămâne același): dash.cloudflare.com/profile/api-tokens → la tokenul «Edit Cloudflare Workers» apasă ⋯ → Edit → Add more → Account / Workers R2 Storage / Edit → Continue to summary → Save. Apoi rulează un build nou.

          $ERRTAIL" 2>/dev/null || true
            else
              gh issue comment "$EXISTING" --body "$ERRTAIL" 2>/dev/null || true
            fi
          fi
          echo "Stocare R2: $R2STATE"
          echo "- Stocarea înregistrărilor (R2): $R2STATE" >> "$GITHUB_STEP_SUMMARY"
          WHO=$(npx wrangler@3 whoami 2>&1 || true)
          echo "$WHO" | head -10
          # Subdomeniul workers.dev (numele public al serverului) — îl înregistrăm automat dacă lipsește.
          ACC=$(echo "$WHO" | grep -oE '[0-9a-f]{32}' | head -1)
          if [ -n "$ACC" ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" \
              | grep -oE '"subdomain":"[^"]+"' | head -1 | cut -d'"' -f4)
            if [ -z "$SUB" ]; then
              WANTED="forja-$(echo "$ACC" | cut -c1-8)"
              echo "Înregistrez subdomeniul: $WANTED.workers.dev"
              curl -s -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"subdomain\":\"$WANTED\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | head -c 400
              echo ""
            else
              echo "Subdomeniu existent: $SUB.workers.dev"
            fi
          fi
          OUT=$(npx wrangler@3 deploy -c "$CFG" 2>&1 | tee /dev/stderr) || true
          URL=$(echo "$OUT" | grep -oE "https://[a-z0-9.-]+\.workers\.dev" | head -1)
          if [ -z "$URL" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            report_problem "$(printf 'whoami:\n%s\n\ndeploy:\n%s' "$(echo "$WHO" | tail -c 2000)" "$(echo "$OUT" | tail -c 8000)")"
            exit 0
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler@3 secret put GEMINI_API_KEY >/dev/null 2>&1 || true
          fi
          # Cheia de administrare: doar CI poate cere serverului să genereze media.
          printf '%s' "$ACC" | npx wrangler@3 secret put ADMIN_KEY >/dev/null 2>&1 || true
          sleep 8

          # ── Pozele aplicației: generate cu FLUX (banca de modele, gratuit) direct în R2 ──
          BASE_PROMPT="vertical candid documentary photograph, cinematic color grade, deep graphite shadows, warm amber highlights, subtle film grain, shallow depth of field, natural imperfect real moment, no studio look, no text, no watermark, no logo"
          GEN_OK=0; GEN_SKIP=0; GEN_ERR=0
          while IFS='|' read -r MID MPROMPT; do
            [ -z "$MID" ] && continue
            if npx wrangler@3 r2 object get "forja-media/$MID.jpg" --file /tmp/chk.bin >/dev/null 2>&1; then
              GEN_SKIP=$((GEN_SKIP+1)); continue
            fi
            DONE=0
            for TRY in 1 2 3; do
              RESP=$(curl -s --max-time 150 -X POST \
                -H "X-Admin: $ACC" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"$MID.jpg\",\"prompt\":\"$MPROMPT, $BASE_PROMPT\"}" \
                "$URL/media/_generate" || true)
              if echo "$RESP" | jq -e '.ok' >/dev/null 2>&1; then
                GEN_OK=$((GEN_OK+1)); DONE=1; break
              fi
              echo "FLUX încercarea $TRY pentru $MID: $(echo "$RESP" | head -c 160)"
              sleep 6
            done
            [ "$DONE" = "0" ] && GEN_ERR=$((GEN_ERR+1))
          done << 'MEDIAEOF'
          354016637|night city boulevard bokeh, warm amber street lanterns glowing, blurred lights, no people
          430398119|a woman in her 30s running along an empty city boulevard before dawn, warm sodium streetlights, breath visible in cold air, seen from the side
          503881704|hands stirring vegetables in a steaming pan, warm window light in a dark kitchen, honest home cooking
          470987805|morning bedroom, low sun through linen curtains, a person in their 30s just waking up, honest messy hair
          1016024842|a person stretching on an apartment balcony at dusk, warm city lights bokeh below, silhouette
          562796663|bedroom at night in deep blue tones, moonlight through the window, calm and cold blue palette
          622385753|a stocky man in his 40s doing a barbell exercise in a small dark gym lit by one warm practical lamp, chalk dust in the air
          330198627|top-down home-cooked bowl with rice grilled chicken and roasted vegetables on a worn wooden table by window light
          471644726|yogurt bowl with granola and berries on a dark wooden table, soft morning light, appetizing food photography
          840977260|a man mid barbell squat in a dark gym, single warm spotlight, focused effort, side view, athletic
          333728678|a man doing a bent-over barbell row in a dark gym, warm rim light, gritty athletic photography
          204232438|a man doing push-ups with dumbbells on a dark gym floor, warm spotlight, athletic effort
          427022252|a man pressing dumbbells overhead in a dark gym, warm dramatic light, athletic
          392709785|a man performing a romanian deadlift with a barbell, dark gym, warm amber spotlight, side view
          MEDIAEOF
          echo "Poze: generate=$GEN_OK existente=$GEN_SKIP erori=$GEN_ERR"
          echo "- Poze AI (FLUX): generate=$GEN_OK · existente=$GEN_SKIP · erori=$GEN_ERR" >> "$GITHUB_STEP_SUMMARY"
          sleep 45
          DIAG=$(curl -s --max-time 280 "$URL/v1/diag" || true)
          if [ -z "$DIAG" ]; then
            sleep 10
            DIAG=$(curl -s --max-time 280 "$URL/v1/diag" || echo '{"diag":"indisponibil (curl a eșuat de două ori)"}')
          fi
          echo "DIAG: $DIAG"
          echo "$DIAG" > /tmp/diag.json
          {
            echo "diag<<DIAGEOF"
            echo "$DIAG"
            echo "DIAGEOF"
          } >> "$GITHUB_OUTPUT"
          echo "Server publicat la: $URL"
          echo "## Serverul central FORJA" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "- Analiza meselor: Gemini (cheia companiei)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Analiza meselor: banca de modele open-source Cloudflare (fără chei)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Sunete somn: Whisper (fără chei)" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: deploy-api
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: gradle_build
        env:
          FORJA_API_URL: ${{ needs.deploy-api.outputs.url }}
        run: |
          set -o pipefail
          echo "FORJA_API_URL=$FORJA_API_URL"
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Verifică serviciile Firebase (forja-65093)
        id: fbcheck
        if: success()
        run: |
          API_KEY=$(python3 -c "import json;print(json.load(open('app/google-services.json'))['client'][0]['api_key'][0]['current_key'])")
          PROJECT=forja-65093
          AUTH_STATUS="NECUNOSCUT"
          FS_STATUS="NECUNOSCUT"
          R=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$API_KEY" -H 'Content-Type: application/json' -d '{"email":"verificare@forja-check.test","password":"x","returnSecureToken":true}' || true)
          if echo "$R" | grep -q "OPERATION_NOT_ALLOWED\|PASSWORD_LOGIN_DISABLED"; then
            AUTH_STATUS="NEACTIVAT — activează Email/Password în consola Firebase (Authentication → Sign-in method)"
          elif echo "$R" | grep -q "EMAIL_NOT_FOUND\|INVALID_LOGIN_CREDENTIALS\|INVALID_PASSWORD"; then
            AUTH_STATUS="ACTIV ✓"
          elif echo "$R" | grep -q "CONFIGURATION_NOT_FOUND"; then
            AUTH_STATUS="NEACTIVAT — deschide Authentication în consola Firebase și apasă Get started, apoi activează Email/Password"
          else
            AUTH_STATUS="NECUNOSCUT: $(echo "$R" | head -c 200)"
          fi
          FS_URL="https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents/ping/ping"
          F=$(curl -s -o /tmp/fs_body -w "%{http_code}" "$FS_URL" || true)
          if grep -q "SERVICE_DISABLED\|has not been used" /tmp/fs_body 2>/dev/null; then
            FS_STATUS="NECREAT — deschide Firestore Database în consola Firebase și apasă Create database"
          else
            case "$F" in
              403) FS_STATUS="EXISTĂ ✓ (regulile blochează accesul anonim — corect)";;
              404) FS_STATUS="NECREAT — deschide Firestore Database în consola Firebase și apasă Create database";;
              200) FS_STATUS="EXISTĂ ✓ (atenție: reguli complet deschise)";;
              *) FS_STATUS="NECUNOSCUT (HTTP $F)";;
            esac
          fi
          {
            echo "AUTH_STATUS<<EOF"; echo "$AUTH_STATUS"; echo "EOF"
            echo "FS_STATUS<<EOF"; echo "$FS_STATUS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "## Stare Firebase" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autentificare email/parolă: $AUTH_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baza de date Firestore: $FS_STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Publică APK-ul la Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_STATUS: ${{ steps.fbcheck.outputs.AUTH_STATUS }}
          FS_STATUS: ${{ steps.fbcheck.outputs.FS_STATUS }}
          FORJA_API_URL: ${{ needs.deploy-api.outputs.url }}
          API_DIAG: ${{ needs.deploy-api.outputs.diag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FORJA.apk
          SIZE=$(du -h FORJA.apk | cut -f1)
          MEDIA_LIST=$(curl -s --max-time 30 "$FORJA_API_URL/media/_list" 2>/dev/null || echo "[]")
          MEDIA_COUNT=$(echo "$MEDIA_LIST" | jq 'length' 2>/dev/null || echo "?")
          MEDIA_NAMES=$(echo "$MEDIA_LIST" | jq -r 'join(", ")' 2>/dev/null | head -c 600 || echo "")
          NOTES=$(cat << EOF
          ## FORJA — aplicația Android (build #${{ github.run_number }})

          **Instalare pe telefon:** descarcă \`FORJA.apk\` de mai jos direct pe telefon, deschide fișierul și acceptă instalarea din surse necunoscute. Mărime: $SIZE.

          **Stare servicii Firebase la momentul build-ului:**
          - Autentificare email/parolă: $AUTH_STATUS
          - Baza de date Firestore: $FS_STATUS
          - Serverul central FORJA: ${FORJA_API_URL:-neconfigurat — analiza rulează local}
          - Media licențiată/generată în R2: $MEDIA_COUNT fișiere ($MEDIA_NAMES)

          <details><summary>Diagnoza modelelor AI</summary>

          \`\`\`json
          ${API_DIAG:-fără date}
          \`\`\`
          </details>

          Commit: ${{ github.sha }}
          EOF
          )
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest FORJA.apk --title "FORJA — ultimul APK (build #${{ github.run_number }})" --notes "$NOTES" --latest

      - name: Upload artifact (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FORJA-apk-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Închide issue-urile de build rezolvate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Build eșuat in:title" --json number -q '.[].number'); do
            gh issue close "$n" -c "Rezolvat — build #${{ github.run_number }} a trecut ✓" || true
          done
          if [ -n "${{ needs.deploy-api.outputs.url }}" ]; then
            for n in $(gh issue list --state open --search "Server nepublicat in:title" --json number -q '.[].number'); do
              gh issue close "$n" -c "Rezolvat — serverul e publicat la ${{ needs.deploy-api.outputs.url }} ✓" || true
            done
          fi

      - name: Raportează eroarea de build ca issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Build eșuat · run ${{ github.run_number }}"
          LOG=$(grep -E "error:|e: |FAILURE:|Caused by|What went wrong|> Task .* FAILED" -A 3 build.log 2>/dev/null | head -c 55000 || true)
          if [ -z "$LOG" ]; then LOG=$(tail -c 55000 build.log 2>/dev/null || echo "fără log"); fi
          BODY=$(printf '%s\n\n```\n%s\n```\nCommit: %s' "Log de eroare (extras automat):" "$LOG" "${{ github.sha }}")
          gh issue create --title "$TITLE" --body "$BODY" --label build-error 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
