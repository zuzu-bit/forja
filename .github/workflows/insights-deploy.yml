name: Deploy FORJA Insights
on:
  push:
    branches: ['research/consented-data-export']
    paths: ['server/**', '.github/workflows/insights-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forja-insights-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node verify-live.mjs --before
      - run: npx wrangler deploy --dry-run -c wrangler.insights.toml
      - name: Publish the existing account-scoped Insights service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Conectarea Cloudflare pentru publicare lipsește din proiect.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx wrangler r2 bucket info forja-insights-data -c wrangler.insights.toml > /dev/null
          npx wrangler deployments list -c wrangler.insights.toml
          npx wrangler deploy -c wrangler.insights.toml --experimental-provision=false
      - name: Verify deployed version, page, scripts and private route
        run: node verify-live.mjs | tee deployment-verification.json
      - name: Keep delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORJA-Site-Verification
          path: server/deployment-verification.json
          if-no-files-found: warn
