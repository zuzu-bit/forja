name: Deploy FORJA Insights
on:
  # Pe ramurile de lucru (claude/**) site-ul se publică doar la cerere (Actions → Run workflow), după ce aplicația și site-ul
  # au fost verificate împreună; altfel orice push intermediar ajungea direct în producție.
  push:
    branches: ['main']
    paths: ['server/**', 'scripts/**', '!scripts/site-shots/**', '.github/workflows/insights-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forja-insights-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node verify-live.mjs --before
      - run: npx wrangler deploy --dry-run -c wrangler.insights.toml
      - name: Publică site-ul FORJA (forja-insights)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Conectarea Cloudflare pentru publicare lipsește din proiect.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx wrangler r2 bucket info forja-insights-data -c wrangler.insights.toml > /dev/null
          npx wrangler deployments list -c wrangler.insights.toml
          npx wrangler deploy -c wrangler.insights.toml --experimental-provision=false
          # Cheia Gemini (dacă există) — aceleași AI-uri performante și pe site.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY -c wrangler.insights.toml >/dev/null 2>&1 || true
          fi
      - name: Verifică versiunea publicată, pagina, scripturile și ruta privată
        run: node verify-live.mjs | tee deployment-verification.json
      - name: Păstrează dovada publicării
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORJA-Site-Verification
          path: server/deployment-verification.json
          if-no-files-found: warn
