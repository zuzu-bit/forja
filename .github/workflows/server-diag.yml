name: Diagnostic server FORJA

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Jurnalul serverului (ultimele cereri) și diagnosticul AI
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          URL="https://forja-api.forja-22e7ea2d.workers.dev"
          echo "== /v1/diag =="
          curl -s --max-time 120 "$URL/v1/diag?models=0" | jq . || true
          echo "== jurnal (admin/api/overview) =="
          curl -s --max-time 60 -H "X-Admin: $ACC" "$URL/admin/api/overview" | jq '.log // .' || true
