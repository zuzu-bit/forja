name = "forja-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "RECORDS"
bucket_name = "forja-sleep"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "forja-media"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

# Additive durable lab journal; fitness/sleep R2 bindings remain unchanged.
[[durable_objects.bindings]]
name = "RESEARCH_REGISTRY"
class_name = "ResearchRegistry"

[[durable_objects.bindings]]
name = "RESEARCH_DEVICES"
class_name = "ResearchDevice"

[[migrations]]
tag = "research-v1"
new_sqlite_classes = ["ResearchRegistry", "ResearchDevice"]
