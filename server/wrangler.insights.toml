name = "forja-insights"
main = "insights-worker.mjs"
compatibility_date = "2025-06-01"

[vars]
ORGANIZER_ANALYSIS_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "RECORDS"
bucket_name = "forja-insights-data"

[[durable_objects.bindings]]
name = "INSIGHTS"
class_name = "InsightsAccount"

[[migrations]]
tag = "insights-v1"
new_sqlite_classes = ["InsightsAccount"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.js.txt"]
fallthrough = true

# Fonturile site-ului (Barlow Condensed, Hanken Grotesk, JetBrains Mono, subset latin-ext) — importate ca ArrayBuffer.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[observability]
enabled = false

[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialGraph"

[[migrations]]
tag = "social-v1"
new_sqlite_classes = ["SocialGraph"]
