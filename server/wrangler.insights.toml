name = "forja-insights"
main = "insights-worker.mjs"
compatibility_date = "2025-06-01"

[vars]
ORGANIZER_ANALYSIS_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "RECORDS"
bucket_name = "forja-insights-data"

# 4.4: the nights of forja-api (audio chunks + analysis.json, 7 days), read-only for the site's "Somn" section.
# Keys are built only from the verified uid: ${uid}/s{id}/chunk_{i}.m4a and ${uid}/s{id}/analysis.json.
[[r2_buckets]]
binding = "SLEEP"
bucket_name = "forja-sleep"

[[durable_objects.bindings]]
name = "INSIGHTS"
class_name = "InsightsAccount"

[[migrations]]
tag = "insights-v1"
new_sqlite_classes = ["InsightsAccount"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.js.txt"]
fallthrough = true

[observability]
enabled = false

[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialGraph"

[[migrations]]
tag = "social-v1"
new_sqlite_classes = ["SocialGraph"]
