package com.forja.app.core.network.dto

import kotlinx.serialization.Serializable

// ⚠️ Ajustează câmpurile ca să corespundă EXACT cu ce trimite/primește backendul Express.

@Serializable
data class LoginRequest(
    val email: String,
    val password: String
)

@Serializable
data class RegisterRequest(
    val name: String,
    val email: String,
    val password: String
)

@Serializable
data class AuthResponse(
    val token: String,
    val user: UserDto
)

@Serializable
data class UserDto(
    val id: String,
    val name: String? = null,
    val email: String
)
